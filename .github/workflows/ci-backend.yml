name: CI backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El CI solo necesita leer el repo: nada de escribir contenido,
# publicar paquetes ni tocar pull requests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: julia
          POSTGRES_PASSWORD: julia123
          POSTGRES_DB: julia_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U julia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://julia:julia123@localhost:5433/julia_test
      JWT_SECRET: secreto-solo-para-ci-con-mas-de-32-caracteres
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Tests con gate de coverage 80%
        run: pytest --cov=app --cov=main --cov-report=term --cov-fail-under=80
