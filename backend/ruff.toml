# La configuración de las herramientas vive en archivos propios y no en
# pyproject.toml: Vercel, al ver un pyproject, asume que ahí están
# declaradas las dependencias e intenta instalarlas con uv, que falla
# porque este proyecto no es un paquete. Sin pyproject usa
# requirements.txt, que es de donde salen las dependencias de verdad.
line-length = 88
target-version = "py313"
exclude = ["alembic/versions", ".venv"]

[lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",
    # Depends()/Query() en argumentos por defecto es el idiom de FastAPI.
    "B008",
    # str + Enum se mantiene por consistencia con FinTrack (no StrEnum).
    "UP042",
]

[lint.per-file-ignores]
# Los imports de modelos en env.py y conftest.py van después de manipular
# sys.path, y algunos existen solo para registrarse en el metadata.
"alembic/env.py" = ["E402", "F401"]
"tests/conftest.py" = ["E402", "F401"]
